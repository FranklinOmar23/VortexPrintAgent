# Compila los instaladores del agente en máquinas de GitHub: la .dmg de macOS solo se puede armar
# en una Mac, y la APK de Android (app "Vortex POS" para tabletas, carpeta android/).
# Corre a mano (Actions > Build instaladores > Run workflow) o al subir un tag v*.
# Los instaladores quedan como "artifacts" de la corrida; se descargan y se copian a
# Frontend/public/downloads del POS (VortexPrintAgent-Setup.exe, VortexPrintAgent-arm64.dmg,
# VortexPrintAgent-x64.dmg, VortexPOS.apk).
name: Build instaladores

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  mac:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Sin cuenta de Apple Developer todavía: se compila sin firmar (macOS pide "Abrir de todos
      # modos" la primera vez). Para firmar y notarizar, cargar CSC_LINK/CSC_KEY_PASSWORD y
      # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID como secrets y quitar esta variable.
      - run: npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: VortexPrintAgent-mac
          path: dist/*.dmg

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: VortexPrintAgent-windows
          path: dist/*.exe

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.VORTEX_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      # Llave de firma fija (secrets) para que las actualizaciones se instalen encima de la versión
      # anterior. Sin ella la APK sale firmada con la llave de depuración del runner.
      - name: Llave de firma
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vortex.jks" && echo "VORTEX_KEYSTORE=$RUNNER_TEMP/vortex.jks" >> "$GITHUB_ENV"
      - run: ./gradlew testReleaseUnitTest assembleRelease --console=plain
        env:
          VORTEX_KEYSTORE_PASSWORD: ${{ secrets.VORTEX_KEYSTORE_PASSWORD }}
          VORTEX_KEY_ALIAS: ${{ secrets.VORTEX_KEY_ALIAS }}
          VORTEX_KEY_PASSWORD: ${{ secrets.VORTEX_KEY_PASSWORD }}
      - run: cp app/build/outputs/apk/release/app-release.apk VortexPOS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VortexPOS-android
          path: android/VortexPOS.apk
